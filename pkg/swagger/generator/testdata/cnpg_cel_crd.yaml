apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.org
spec:
  group: example.org
  names:
    kind: Widget
    plural: widgets
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                synchronous:
                  type: object
                  required: [method, number]
                  properties:
                    method:
                      type: string
                      enum: [any, first]
                    number:
                      type: integer
                      x-kubernetes-validations:
                        - rule: self > 0
                    dataDurability:
                      type: string
                      enum: [required, preferred]
                    standbyNamesPre:
                      type: array
                      items:
                        type: string
                    standbyNamesPost:
                      type: array
                      items:
                        type: string
                  x-kubernetes-validations:
                    - rule: "self.dataDurability!='preferred' || ((!has(self.standbyNamesPre) || self.standbyNamesPre.size()==0) && (!has(self.standbyNamesPost) || self.standbyNamesPost.size()==0))"
